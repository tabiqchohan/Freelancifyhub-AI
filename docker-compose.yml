services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: freelancify-ai:latest
    container_name: freelancify-ai
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
    env_file:
      - path: .env
        required: false
    volumes:
      - app-logs:/app/logs
      - app-memory:/app/memory
      - app-knowledge:/app/knowledge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-logs:
  app-memory:
  app-knowledge:
