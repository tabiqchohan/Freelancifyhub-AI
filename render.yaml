services:
  # Prompts15 Phase 11 — Render blueprint for the AI Operating System.
  #
  # Secrets are intentionally NOT given values here. Set them in the Render
  # dashboard (or via `render` CLI secrets), never in this file. The service is
  # fail-closed: with no AIOS_SERVICE_TOKEN every business endpoint is denied.
  - type: web
    name: freelancify-ai
    runtime: node
    plan: starter
    region: oregon # keep colocated with the Neon primary region
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /readyz
    # Shutdown contract: src/index.ts installs SIGTERM/SIGINT handlers that drain
    # for at most SHUTDOWN_DRAIN_TIMEOUT_MS (10s) and then force-exit, so the
    # service terminates well inside Render's grace period.
    autoDeploy: false
    envVars:
      # --- Required, set as secrets in the dashboard ----------------------------
      - key: AIOS_SERVICE_TOKEN
        sync: false
      - key: AIOS_ADMIN_TOKEN
        sync: false

      # --- Runtime ----------------------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically; do not pin it here.
      - key: LOG_LEVEL
        value: info
      # Structured JSON in production. `pino-pretty` is a dev-only dependency and
      # is pruned from the runtime image; src/lib/logger.ts also forces JSON when
      # NODE_ENV=production, so this is belt-and-braces.
      - key: LOG_PRETTY
        value: 'false'

      # --- Auth posture -----------------------------------------------------------
      # Fail-closed escape hatch. Always ignored when NODE_ENV=production, but
      # pinned false so the intent is explicit in the deployment manifest.
      - key: AIOS_ALLOW_UNAUTHENTICATED
        value: 'false'

      # --- Durable storage --------------------------------------------------------
      # Accepted values are exactly `in-memory` and `durable` (NOT `postgres`);
      # src/app/composition-root.ts rejects anything else at boot.
      - key: MEMORY_STORAGE_BACKEND
        value: durable
      - key: KNOWLEDGE_STORAGE_BACKEND
        value: durable
      - key: TOOLS_STORAGE_BACKEND
        value: durable
      - key: MEMORY_DATABASE_URL
        sync: false

      # --- AI Employee (AG-701) durable storage + retention -----------------------
      # Prompts19 added PostgreSQL-backed task/artifact storage, restart recovery,
      # a TTL reaper and bounded concurrency. In production the employee storage
      # backend MUST be durable (an explicit `in-memory` is rejected at boot), so
      # status and review artifacts survive a restart. When EMPLOYEE_DATABASE_URL
      # is left unset it falls back to MEMORY_DATABASE_URL (never a second secret).
      - key: EMPLOYEE_ENABLED
        value: 'true'
      - key: EMPLOYEE_STORAGE_BACKEND
        value: durable
      - key: EMPLOYEE_DATABASE_URL
        sync: false
      # Writable scratch root owned by the runtime user (see Dockerfile).
      - key: EMPLOYEE_WORKSPACE_ROOT
        value: /app/.employee-workspaces
      # Explicit retention + resource limits (env-driven, never hard-coded).
      - key: EMPLOYEE_MAX_ACTIVE_TASKS
        value: '4'
      - key: EMPLOYEE_MAX_USER_ACTIVE_TASKS
        value: '1'
      - key: EMPLOYEE_QUEUE_CAPACITY
        value: '16'
      - key: EMPLOYEE_ARTIFACT_TTL_MS
        value: '86400000'
      - key: EMPLOYEE_REAP_INTERVAL_MS
        value: '600000'

      # --- LLM (fail-closed) ------------------------------------------------------
      # LLM reasoning is DISABLED until a real provider is configured. The AI
      # Employee (AG-701) is deterministic and does NOT use the LLM, so it runs
      # with LLM_ENABLED=false. The reasoning agent teams stay unavailable, and
      # /healthz reports llm.provider=disabled (never a false "ready").
      #
      # To enable real reasoning: set LLM_ENABLED=true, LLM_PROVIDER=http,
      # LLM_MODEL to a model verified against the provider, and LLM_API_KEY as a
      # dashboard secret. Startup fails closed when http is enabled without a key.
      # Do NOT enable `mock` in production: it performs no network call and must
      # never be presented as a production LLM provider.
      - key: LLM_ENABLED
        value: 'false'
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: mock-model-1.0
      - key: LLM_API_KEY
        sync: false
